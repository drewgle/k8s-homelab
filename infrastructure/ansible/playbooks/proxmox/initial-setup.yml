---
- name: Initial Proxmox VE Setup
  hosts: proxmox
  become: yes
  gather_facts: yes
  vars_files:
    - ../vars.yml
  
  vars:
    # Fetch SSH keys from GitHub (will get all public keys for the user)
    github_ssh_keys_url: "https://github.com/{{ github_username }}.keys"
    
  tasks:
    - name: Ensure SSH directory exists
      file:
        path: /root/.ssh
        state: directory
        mode: '0700'
        owner: root
        group: root

    - name: Fetch SSH keys from GitHub user
      uri:
        url: "{{ github_ssh_keys_url }}"
        method: GET
        return_content: yes
        timeout: 30
      register: github_ssh_keys
      delegate_to: localhost
      run_once: true

    - name: Add GitHub SSH keys to authorized_keys
      authorized_key:
        user: root
        state: present
        key: "{{ item }}"
        comment: "GitHub key for {{ github_username }}"
      with_items: "{{ github_ssh_keys.content.split('\n') }}"
      when: 
        - item != ""
        - item is match("^(ssh-rsa|ssh-ed25519|ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521).*")

    - name: Backup original sources.list
      copy:
        src: /etc/apt/sources.list
        dest: /etc/apt/sources.list.backup
        remote_src: yes
        backup: yes
      ignore_errors: yes

    - name: Remove/comment out enterprise repository
      lineinfile:
        path: /etc/apt/sources.list.d/pve-enterprise.list
        regexp: '^deb https://enterprise\.proxmox\.com/debian/pve'
        line: '# deb https://enterprise.proxmox.com/debian/pve bullseye pve-enterprise'
        backup: yes
      ignore_errors: yes
      notify: update apt cache

    - name: Add Proxmox VE No-Subscription Repository (Bullseye)
      lineinfile:
        path: /etc/apt/sources.list.d/pve-no-subscription.list
        line: 'deb http://download.proxmox.com/debian/pve bullseye pve-no-subscription'
        create: yes
        backup: yes
      notify: update apt cache

    - name: Add Proxmox VE No-Subscription Repository (Bookworm - for newer versions)
      lineinfile:
        path: /etc/apt/sources.list.d/pve-no-subscription.list
        line: 'deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription'
        create: yes
        backup: yes
      when: ansible_distribution_major_version|int >= 12
      notify: update apt cache

    - name: Disable Proxmox VE enterprise subscription nag
      replace:
        path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
        regexp: "if \\(data\\.status !== 'Active'\\) \\{"
        replace: "if (false) {"
        backup: yes
      ignore_errors: yes

    - name: Alternative method - Disable subscription nag (newer versions)
      replace:
        path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
        regexp: "Ext\\.Msg\\.show\\(\\{"
        replace: "void({ //Ext.Msg.show({"
        backup: yes
      ignore_errors: yes

    - name: Update APT cache
      apt:
        update_cache: yes
      when: not ansible_check_mode

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: upgrade_result
      when: not ansible_check_mode

    - name: Show upgrade results
      debug:
        var: upgrade_result
      when: upgrade_result is defined and upgrade_result.changed

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Notify about reboot requirement
      debug:
        msg: "Reboot is required for {{ inventory_hostname }}"
      when: reboot_required.stat.exists

    - name: Install useful packages
      apt:
        name:
          - vim
          - htop
          - curl
          - wget
          - git
          - nfs-common
          - open-iscsi
        state: present
      when: not ansible_check_mode

  handlers:
    - name: update apt cache
      apt:
        update_cache: yes