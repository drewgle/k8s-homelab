---
- name: Initial Proxmox VE Setup
  hosts: proxmox
  become: yes
  gather_facts: yes
  vars_files:
    - "{{ playbook_dir }}/../../vars.yml"

  vars:
    # Fetch SSH keys from GitHub (will get all public keys for the user)
    github_ssh_keys_url: "https://github.com/{{ github_username }}.keys"

  tasks:
    - name: Ensure SSH directory exists
      file:
        path: /root/.ssh
        state: directory
        mode: '0700'
        owner: root
        group: root

    - name: Fetch SSH keys from GitHub user
      uri:
        url: "{{ github_ssh_keys_url }}"
        method: GET
        return_content: yes
        timeout: 30
      register: github_ssh_keys
      delegate_to: localhost
      run_once: true

    - name: Add GitHub SSH keys to authorized_keys
      authorized_key:
        user: root
        state: present
        key: "{{ item }}"
        comment: "GitHub key for {{ github_username }}"
      with_items: "{{ github_ssh_keys.content.split('\n') }}"
      when:
        - item != ""
        - item is match("^(ssh-rsa|ssh-ed25519|ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521).*")

    - name: Backup original sources.list
      copy:
        src: /etc/apt/sources.list
        dest: /etc/apt/sources.list.backup
        remote_src: yes
        backup: yes
      ignore_errors: yes

    - name: Find repository files referencing the enterprise repo
      find:
        paths: /etc/apt/sources.list.d
        patterns:
          - '*.list'
          - '*.sources'
        contains: 'enterprise\.proxmox\.com'
      register: enterprise_repo_files

    - name: Comment out enterprise repo entries (one-line .list format)
      replace:
        path: "{{ item.path }}"
        regexp: '^(deb\s+.*enterprise\.proxmox\.com.*)$'
        replace: '# \1'
        backup: yes
      loop: "{{ enterprise_repo_files.files | selectattr('path', 'search', '\\.list$') | list }}"
      loop_control:
        label: "{{ item.path }}"
      notify: update apt cache

    - name: Disable enterprise repo entries (deb822 .sources format)
      lineinfile:
        path: "{{ item.path }}"
        regexp: '^Enabled:'
        line: 'Enabled: false'
        insertafter: '^Types:'
        backup: yes
      loop: "{{ enterprise_repo_files.files | selectattr('path', 'search', '\\.sources$') | list }}"
      loop_control:
        label: "{{ item.path }}"
      notify: update apt cache

    - name: Configure Proxmox VE no-subscription repository for the detected release
      copy:
        content: |
          deb http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription
        dest: /etc/apt/sources.list.d/pve-no-subscription.list
        mode: '0644'
        backup: yes
      notify: update apt cache

    - name: Check for proxmox-widget-toolkit library
      stat:
        path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
      register: proxmoxlib

    - name: Disable subscription nag dialog
      replace:
        path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
        regexp: "\\.data\\.status\\.toLowerCase\\(\\)\\s*!==\\s*'active'"
        replace: ".data.status.toLowerCase() == 'NoMoreNagging'"
        backup: yes
      when: proxmoxlib.stat.exists
      notify: restart pveproxy

    - name: Verify the nag patch is present
      command: grep -q NoMoreNagging /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
      changed_when: false
      failed_when: false
      register: nag_check
      when: proxmoxlib.stat.exists

    - name: Warn when the nag pattern was not found
      debug:
        msg: >-
          WARNING: subscription-nag pattern not found in proxmoxlib.js -
          the UI dialog may still appear (widget-toolkit layout changed?)
      when: proxmoxlib.stat.exists and nag_check.rc != 0

    - name: Keep the nag disabled across proxmox-widget-toolkit upgrades
      copy:
        content: |
          DPkg::Post-Invoke { "dpkg -V proxmox-widget-toolkit | grep -q '/proxmoxlib\.js$'; if [ $? -eq 1 ]; then { echo 'Removing subscription nag from UI...'; sed -i '/data\.status/{s/\!//;s/active/NoMoreNagging/}' /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js; }; fi"; };
        dest: /etc/apt/apt.conf.d/no-nag-script
        mode: '0644'

    - name: Update APT cache
      apt:
        update_cache: yes
      when: not ansible_check_mode

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: upgrade_result
      when: not ansible_check_mode

    - name: Show upgrade results
      debug:
        var: upgrade_result
      when: upgrade_result is defined and upgrade_result.changed

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Notify about reboot requirement
      debug:
        msg: "Reboot is required for {{ inventory_hostname }}"
      when: reboot_required.stat.exists

    - name: Install useful packages
      apt:
        name:
          - vim
          - htop
          - curl
          - wget
          - git
          - nfs-common
          - open-iscsi
        state: present
      when: not ansible_check_mode

  handlers:
    - name: update apt cache
      apt:
        update_cache: yes

    - name: restart pveproxy
      systemd:
        name: pveproxy
        state: restarted
