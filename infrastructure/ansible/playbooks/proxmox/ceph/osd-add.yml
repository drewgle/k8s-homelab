---
- name: Add OSDs to Ceph Cluster
  hosts: proxmox
  become: yes
  gather_facts: yes
  vars_files:
    - ../../../vars.yml

  tasks:
    - name: Verify Ceph cluster exists
      stat:
        path: /etc/ceph/ceph.conf
      register: ceph_config_check

    - name: Fail if no Ceph configuration found
      fail:
        msg: "No Ceph cluster configuration found. Run cluster-init.yml or add-node.yml first."
      when: not ceph_config_check.stat.exists

    - name: Check cluster connectivity
      command: ceph health
      register: cluster_connectivity
      failed_when: false
      changed_when: false

    - name: Verify cluster is accessible
      fail:
        msg: "Cannot connect to Ceph cluster from {{ inventory_hostname }}. Check network and authentication."
      when: cluster_connectivity.rc != 0

    - name: Detect available disks for OSDs
      shell: |
        lsblk -dno NAME,SIZE,TYPE,MOUNTPOINT | grep disk | grep -v sda | awk '$4=="" {print "/dev/" $1}'
      register: available_disks
      changed_when: false

    - name: Display available disks
      debug:
        msg: "Available disks on {{ inventory_hostname }}: {{ available_disks.stdout_lines | default(['none']) }}"

    - name: Check if any disks are already OSDs  
      shell: |
        for disk in {{ available_disks.stdout_lines | join(' ') }}; do
          if ceph-disk list | grep -q "$disk"; then
            echo "$disk already_osd"
          else
            echo "$disk available"
          fi
        done
      register: disk_status
      changed_when: false
      when: available_disks.stdout_lines | length > 0

    - name: Filter out already configured OSDs
      set_fact:
        new_disks: "{{ disk_status.stdout_lines | select('search', 'available') | map('regex_replace', ' available', '') | list }}"
      when: 
        - available_disks.stdout_lines | length > 0
        - disk_status is defined

    - name: Display new disks to be configured
      debug:
        msg: "New disks to configure as OSDs on {{ inventory_hostname }}: {{ new_disks | default(['none']) }}"

    - name: Prepare OSDs on new disks
      command: ceph-disk prepare {{ item }}
      loop: "{{ new_disks | default([]) }}"
      when: 
        - new_disks is defined
        - new_disks | length > 0
      register: osd_creation
      ignore_errors: yes

    - name: Display OSD creation results
      debug:
        msg: "OSD creation on {{ item.item }}: {{ 'SUCCESS' if item.rc == 0 else 'FAILED - ' + item.stderr | default('unknown error') }}"
      loop: "{{ osd_creation.results | default([]) }}"
      when: osd_creation is defined

    - name: Wait for OSDs to be activated
      pause:
        seconds: 30
        prompt: "Waiting for new OSDs to be activated and join the cluster..."
      when: 
        - new_disks | default([]) | length > 0
        - osd_creation.results | selectattr('rc', 'equalto', 0) | list | length > 0
      run_once: true

    - name: Check OSD status after creation
      command: ceph osd tree
      register: osd_tree_status
      run_once: true
      delegate_to: "{{ groups['proxmox'][0] }}"
      ignore_errors: yes

    - name: Display current OSD layout
      debug:
        msg: |
          Current OSD Tree:
          {{ osd_tree_status.stdout_lines | join('\n          ') }}
      run_once: true
      when: osd_tree_status.rc == 0

    - name: Check cluster storage status
      command: ceph df
      register: cluster_storage_status
      run_once: true
      delegate_to: "{{ groups['proxmox'][0] }}"
      ignore_errors: yes

    - name: Display storage utilization
      debug:
        msg: |
          Cluster Storage Status:
          {{ cluster_storage_status.stdout_lines | join('\n          ') }}
      run_once: true
      when: cluster_storage_status.rc == 0

    - name: Count newly added OSDs
      set_fact:
        new_osd_count: "{{ groups['proxmox'] | map('extract', hostvars, 'new_disks') | map('default', []) | map('length') | sum }}"
      run_once: true

    - name: Display OSD addition summary
      debug:
        msg: |
          💾 OSD Addition Summary:
          
          - Total new disks processed: {{ new_osd_count }}
          - Nodes with new OSDs: {{ groups['proxmox'] | select('in', hostvars.keys()) | select('extract', hostvars, 'new_disks') | select() | list | join(', ') }}
          
          {% if new_osd_count | int > 0 %}
          Next Steps:
          1. Monitor rebalancing: ceph -w
          2. Check cluster health: ceph health detail
          3. Verify OSD integration: ceph osd tree
          4. Wait for rebalancing to complete before major operations
          {% else %}
          No new OSDs were added. All available disks may already be in use.
          {% endif %}
      run_once: true