---
- name: Add Node to Existing Ceph Cluster
  hosts: proxmox
  become: yes
  gather_facts: no
  vars_files:
    - "{{ playbook_dir }}/../../../vars.yml"

  vars:
    desired_mon_count: 3

  tasks:
    - name: Verify Ceph cluster exists
      stat:
        path: /etc/pve/ceph.conf
      register: ceph_config_exists

    - name: Fail if no Ceph cluster found
      fail:
        msg: "No existing Ceph cluster found. Use 02-cluster-init.yml for initial setup."
      when: not ceph_config_exists.stat.exists
      run_once: true

    - name: Check if Ceph packages are installed
      stat:
        path: /usr/bin/ceph-osd
      register: ceph_osd_binary

    - name: Install Ceph on new nodes via pveceph
      command: pveceph install --repository no-subscription
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: not ceph_osd_binary.stat.exists
      register: ceph_install

    - name: Get current monitor list
      command: ceph mon dump --format json
      register: mon_dump
      changed_when: false
      run_once: true
      delegate_to: "{{ groups['proxmox'][0] }}"

    - name: Determine which nodes should become monitors
      set_fact:
        current_mons: "{{ mons }}"
        new_mons: "{{ (groups['proxmox'] | reject('in', mons) | list)[:mons_needed | int] }}"
      vars:
        mons: "{{ (mon_dump.stdout | from_json).mons | map(attribute='name') | list }}"
        mons_needed: "{{ [0, desired_mon_count - (mons | length)] | max }}"
      run_once: true

    - name: Display node addition plan
      debug:
        msg: |
          Ceph node addition plan:
          - Packages installed on: {{ ansible_play_hosts | map('extract', hostvars, 'ceph_install') | selectattr('changed', 'defined') | selectattr('changed') | list | length }} node(s)
          - Current monitors: {{ current_mons | join(', ') }}
          - New monitors to create: {{ new_mons | join(', ') if new_mons | length > 0 else 'none (already at ' + (current_mons | length | string) + ')' }}
      run_once: true

    - name: Create monitors on new monitor nodes (sequentially)
      command: pveceph mon create
      when: inventory_hostname in new_mons
      throttle: 1
      register: mon_create
      failed_when: mon_create.rc != 0 and 'already exists' not in (mon_create.stderr | default(''))

    - name: Create managers on new monitor nodes (sequentially)
      command: pveceph mgr create
      when: inventory_hostname in new_mons
      throttle: 1
      register: mgr_create
      failed_when: mgr_create.rc != 0 and 'already exists' not in (mgr_create.stderr | default(''))

    - name: Check cluster health
      command: ceph health
      register: cluster_health_check
      changed_when: false
      run_once: true
      delegate_to: "{{ groups['proxmox'][0] }}"

    - name: Display node addition completion
      debug:
        msg: |
          Ceph node addition complete.

          Cluster health: {{ cluster_health_check.stdout }}

          Next Steps:
          1. Run 03-osd-add.yml to add storage from the new node(s)
          2. Monitor rebalancing: ceph -w
      run_once: true
