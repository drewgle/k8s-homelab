---
- name: Pre-upgrade health check
  import_playbook: health-check.yml

- name: Upgrade Talos Cluster
  hosts: localhost
  become: no
  gather_facts: no
  vars_files:
    - "{{ playbook_dir }}/../../vars.yml"

  vars:
    talos_dir: "{{ playbook_dir }}/../../../linux/talos"
    talosconfig: "{{ talos_dir }}/generated/talosconfig"
    kubeconfig: "{{ talos_dir }}/generated/kubeconfig"
    versions: "{{ lookup('file', talos_dir + '/versions.yaml') | from_yaml }}"
    talos_installer_version: "{{ versions.talos.installer }}"
    kubernetes_version: "{{ versions.kubernetes.version }}"
    preserve_data: "{{ preserve | default(true) }}"
    staged_upgrade: "{{ staged | default(true) }}"

  tasks:
    - name: Confirm upgrade
      pause:
        prompt: |
          About to upgrade Talos cluster to version {{ talos_installer_version }}
          Kubernetes version: {{ kubernetes_version }}
          Preserve data: {{ preserve_data }}
          Staged upgrade: {{ staged_upgrade }}

          Press ENTER to continue or Ctrl+C to abort
      when: not (auto_approve | default(false))

    - name: Upgrade control plane nodes sequentially
      command: >
        talosctl upgrade
        --talosconfig {{ talosconfig }}
        --nodes={{ hostvars[item]['ansible_host'] }}
        --endpoints={{ hostvars[item]['ansible_host'] }}
        --image=ghcr.io/siderolabs/installer:{{ talos_installer_version }}
        {{ '--preserve' if preserve_data else '' }}
        {{ '--stage' if staged_upgrade else '' }}
        --wait=true
      loop: "{{ groups['talos_controlplane'] }}"
      register: upgrade_cp_results
      throttle: 1

    - name: Verify control plane health after upgrade
      command: >
        kubectl --kubeconfig={{ kubeconfig }}
        get nodes -l node-role.kubernetes.io/control-plane
      register: cp_status
      retries: 10
      delay: 30
      until: "'NotReady' not in cp_status.stdout"

    - name: Upgrade worker nodes in batches
      command: >
        talosctl upgrade
        --talosconfig {{ talosconfig }}
        --nodes={{ hostvars[item]['ansible_host'] }}
        --endpoints={{ hostvars[item]['ansible_host'] }}
        --image=ghcr.io/siderolabs/installer:{{ talos_installer_version }}
        {{ '--preserve' if preserve_data else '' }}
        {{ '--stage' if staged_upgrade else '' }}
        --wait=true
      loop: "{{ groups['talos_worker'] | default([]) }}"
      register: upgrade_worker_results
      throttle: "{{ worker_upgrade_batch_size | default(1) }}"

    - name: Wait for all workers to be ready
      command: >
        kubectl --kubeconfig={{ kubeconfig }}
        wait --for=condition=Ready node {{ item }} --timeout=300s
      loop: "{{ groups['talos_worker'] | default([]) }}"

    - name: Load cluster secrets
      include_vars:
        file: "{{ talos_dir }}/secrets.yaml"
        name: talos_secrets

    - name: Update control plane machine configurations with new versions
      template:
        src: "{{ talos_dir }}/templates/controlplane.yaml.j2"
        dest: "{{ talos_dir }}/generated/{{ node_hostname }}-controlplane.yaml"
        mode: '0600'
      loop: "{{ groups['talos_controlplane'] }}"
      loop_control:
        loop_var: node_hostname
      vars:
        node_ip: "{{ hostvars[node_hostname]['ansible_host'] }}"

    - name: Update worker machine configurations with new versions
      template:
        src: "{{ talos_dir }}/templates/worker.yaml.j2"
        dest: "{{ talos_dir }}/generated/{{ node_hostname }}-worker.yaml"
        mode: '0600'
      loop: "{{ groups['talos_worker'] | default([]) }}"
      loop_control:
        loop_var: node_hostname
      vars:
        node_ip: "{{ hostvars[node_hostname]['ansible_host'] }}"

    - name: Apply updated machine configurations to control plane
      command: >
        talosctl apply-config
        --talosconfig {{ talosconfig }}
        --nodes {{ hostvars[item]['ansible_host'] }}
        --endpoints {{ hostvars[item]['ansible_host'] }}
        --file {{ talos_dir }}/generated/{{ item }}-controlplane.yaml
      loop: "{{ groups['talos_controlplane'] }}"

    - name: Apply updated machine configurations to workers
      command: >
        talosctl apply-config
        --talosconfig {{ talosconfig }}
        --nodes {{ hostvars[item]['ansible_host'] }}
        --endpoints {{ hostvars[groups['talos_controlplane'][0]]['ansible_host'] }}
        --file {{ talos_dir }}/generated/{{ item }}-worker.yaml
      loop: "{{ groups['talos_worker'] | default([]) }}"

    - name: Verify cluster version
      command: >
        kubectl --kubeconfig={{ kubeconfig }}
        version
      register: cluster_version

    - name: Display upgrade results
      debug:
        msg: |
          === Talos Cluster Upgrade Complete ===
          Target Talos Version: {{ talos_installer_version }}
          Target Kubernetes Version: {{ kubernetes_version }}
          Current Cluster Version: {{ cluster_version.stdout }}

          Control Plane Upgrades: {{ upgrade_cp_results.results | length }} completed
          Worker Upgrades: {{ upgrade_worker_results.results | default([]) | length }} completed

- name: Post-upgrade health check
  import_playbook: health-check.yml
