---
- name: Remove Talos VMs from Proxmox
  hosts: proxmox
  become: yes
  gather_facts: no
  vars_files:
    - "{{ playbook_dir }}/../vars.yml"

  vars:
    target_vms: "{{ groups['talos_controlplane'] + (groups['talos_worker'] | default([])) }}"

  tasks:
    - name: Check if any VMs exist for removal
      assert:
        that:
          - target_vms | length > 0
        fail_msg: "No Talos VMs found in inventory to remove"
        success_msg: "Found {{ target_vms | length }} Talos VMs in inventory"
      run_once: true

    - name: Get VM list from this Proxmox node
      command: qm list
      register: vm_list_raw
      changed_when: false

    - name: Determine which target VMs exist on this node
      set_fact:
        vms_to_remove: >-
          {{ target_vms
             | map('extract', hostvars)
             | selectattr('vm_id', 'defined')
             | selectattr('vm_id', 'in', local_vm_ids | map('int') | list)
             | map(attribute='inventory_hostname')
             | list }}
      vars:
        local_vm_ids: >-
          {{ vm_list_raw.stdout_lines[1:]
             | map('trim')
             | map('regex_replace', '\s+.*$', '')
             | list }}

    - name: Display VMs to be removed
      debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ vms_to_remove | join(', ') if vms_to_remove | length > 0 else 'no matching VMs on this node' }}

    - name: Confirm VM removal
      pause:
        prompt: |

          WARNING: This will permanently destroy the Talos VMs listed above and all their data!

          This action cannot be undone.

          Type 'yes' to confirm removal, or 'no' to cancel
      register: confirmation
      when: not (force | default(false) | bool)

    - name: Validate confirmation
      assert:
        that:
          - (force | default(false) | bool) or confirmation.user_input | lower == 'yes'
        fail_msg: "VM removal cancelled by user"
        success_msg: "VM removal confirmed"
      run_once: true

    - name: Stop VMs before removal
      command: qm stop {{ hostvars[item]['vm_id'] }}
      loop: "{{ vms_to_remove }}"
      register: vm_stop_result
      failed_when: vm_stop_result.rc != 0 and 'not running' not in vm_stop_result.stderr
      changed_when: vm_stop_result.rc == 0

    - name: Remove VMs and their disks
      command: qm destroy {{ hostvars[item]['vm_id'] }} --purge
      loop: "{{ vms_to_remove }}"
      register: vm_removal
      failed_when: vm_removal.rc != 0 and 'does not exist' not in vm_removal.stderr

    - name: Display removal summary
      debug:
        msg: >-
          {{ inventory_hostname }}: removed
          {{ vms_to_remove | join(', ') if vms_to_remove | length > 0 else 'nothing' }}
