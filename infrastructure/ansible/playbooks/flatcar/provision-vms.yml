---
- name: Provision Flatcar VMs on Proxmox
  hosts: proxmox[0]
  become: yes
  gather_facts: yes
  vars_files:
    - ../../vars.yml

  vars:
    # Load version information
    versions: "{{ lookup('file', '../../linux/flatcar/versions.yaml') | from_yaml }}"
    flatcar_version: "{{ versions.flatcar.version }}"
    flatcar_channel: "{{ versions.flatcar.channel }}"
    
    # VM specifications
    vm_specs:
      controlplane:
        cores: "{{ vm_cp_cores | default(4) }}"
        memory: "{{ vm_cp_memory | default(4096) }}"
        disk_size: "{{ vm_cp_disk_size | default('50G') }}"
      worker:
        cores: "{{ vm_worker_cores | default(2) }}"
        memory: "{{ vm_worker_memory | default(8192) }}"
        disk_size: "{{ vm_worker_disk_size | default('100G') }}"

  tasks:
    - name: Check Proxmox cluster status
      command: pvecm status
      register: cluster_status
      failed_when: false

    - name: Verify Proxmox cluster is healthy
      assert:
        that: cluster_status.rc == 0
        fail_msg: "Proxmox cluster not available or unhealthy"
        success_msg: "Proxmox cluster is operational"

    - name: Create Flatcar VLAN bridge if not exists
      shell: |
        if ! ip link show {{ vm_bridge_name | default('vmbr1') }} >/dev/null 2>&1; then
          ip link add name {{ vm_bridge_name | default('vmbr1') }} type bridge
          ip link set {{ vm_bridge_name | default('vmbr1') }} up
          echo "auto {{ vm_bridge_name | default('vmbr1') }}" >> /etc/network/interfaces
          echo "iface {{ vm_bridge_name | default('vmbr1') }} inet manual" >> /etc/network/interfaces
          echo "        bridge-ports none" >> /etc/network/interfaces
          echo "        bridge-stp off" >> /etc/network/interfaces
          echo "        bridge-fd 0" >> /etc/network/interfaces
          echo "        bridge-vlan-aware yes" >> /etc/network/interfaces
        fi
      register: bridge_created
      changed_when: "'Bridge created' in bridge_created.stdout"

    - name: Check if Flatcar ISO exists
      stat:
        path: "/var/lib/vz/template/iso/flatcar-{{ flatcar_channel }}-{{ flatcar_version }}-amd64.iso"
      register: flatcar_iso

    - name: Download Flatcar ISO
      get_url:
        url: "https://{{ flatcar_channel }}.release.flatcar-linux.net/amd64-usr/{{ flatcar_version }}/flatcar_production_iso_image.iso"
        dest: "/var/lib/vz/template/iso/flatcar-{{ flatcar_channel }}-{{ flatcar_version }}-amd64.iso"
        mode: '0644'
        timeout: 600
      when: not flatcar_iso.stat.exists
      register: iso_download

    - name: Generate cloud-init user data for Flatcar nodes
      template:
        src: "../../linux/flatcar/templates/cloud-init-flatcar.yaml.j2"
        dest: "/tmp/flatcar-cloud-init-{{ item }}.yaml"
        mode: '0644'
      loop: "{{ groups['flatcar_controlplane'] + groups['flatcar_worker'] | default([]) }}"
      vars:
        node_hostname: "{{ item }}"
        node_ip: "{{ hostvars[item]['ansible_host'] }}"
        node_gateway: "{{ vm_gateway }}"

    - name: Generate Ignition configs for control plane nodes
      template:
        src: "../../linux/flatcar/templates/controlplane.yaml.j2"
        dest: "/tmp/flatcar-ignition-{{ item }}.yaml"
        mode: '0644'
      loop: "{{ groups['flatcar_controlplane'] }}"

    - name: Generate Ignition configs for worker nodes
      template:
        src: "../../linux/flatcar/templates/worker.yaml.j2"
        dest: "/tmp/flatcar-ignition-{{ item }}.yaml"
        mode: '0644'
      loop: "{{ groups['flatcar_worker'] }}"

    - name: Create control plane VMs
      shell: |
        # Check if VM already exists
        if qm list | grep -q "{{ hostvars[item]['vm_id'] }}"; then
          echo "VM {{ item }} already exists"
          exit 0
        fi
        
        # Create VM
        qm create {{ hostvars[item]['vm_id'] }} \
          --name {{ item }} \
          --memory {{ vm_specs.controlplane.memory }} \
          --cores {{ vm_specs.controlplane.cores }} \
          --sockets 1 \
          --numa 1 \
          --ostype l26 \
          --cpu cputype=host \
          --scsihw virtio-scsi-pci \
          --scsi0 {{ vm_storage | default('local-lvm') }}:{{ vm_specs.controlplane.disk_size }},iothread=1 \
          --ide2 local:iso/flatcar-{{ flatcar_channel }}-{{ flatcar_version }}-amd64.iso,media=cdrom \
          --boot order=ide2 \
          --net0 virtio,bridge={{ vm_bridge_name | default('vmbr1') }},tag={{ vm_vlan_id | default(100) }},firewall=1 \
          --serial0 socket \
          --vga serial0 \
          --agent enabled=1,fstrim_cloned_disks=1 \
          --onboot 1 \
          --protection 0 \
          --tablet 0 \
          --cicustom "user=local:snippets/flatcar-cloud-init-{{ item }}.yaml" \
          --ipconfig0 ip={{ hostvars[item]['ansible_host'] }}/{{ vm_cidr_bits | default('24') }},gw={{ vm_gateway }}
          
        # Set VM options for Flatcar
        qm set {{ hostvars[item]['vm_id'] }} \
          --args "-machine q35,accel=kvm -cpu host,+aes,+avx,+avx2 -smp {{ vm_specs.controlplane.cores }},sockets=1,cores={{ vm_specs.controlplane.cores }},threads=1"
          
        echo "Created VM {{ item }}"
      loop: "{{ groups['flatcar_controlplane'] }}"
      register: cp_vm_creation
      changed_when: "'Created VM' in cp_vm_creation.stdout"

    - name: Create worker VMs
      shell: |
        # Check if VM already exists
        if qm list | grep -q "{{ hostvars[item]['vm_id'] }}"; then
          echo "VM {{ item }} already exists"
          exit 0
        fi
        
        # Create VM
        qm create {{ hostvars[item]['vm_id'] }} \
          --name {{ item }} \
          --memory {{ vm_specs.worker.memory }} \
          --cores {{ vm_specs.worker.cores }} \
          --sockets 1 \
          --numa 1 \
          --ostype l26 \
          --cpu cputype=host \
          --scsihw virtio-scsi-pci \
          --scsi0 {{ vm_storage | default('local-lvm') }}:{{ vm_specs.worker.disk_size }},iothread=1 \
          --ide2 local:iso/flatcar-{{ flatcar_channel }}-{{ flatcar_version }}-amd64.iso,media=cdrom \
          --boot order=ide2 \
          --net0 virtio,bridge={{ vm_bridge_name | default('vmbr1') }},tag={{ vm_vlan_id | default(100) }},firewall=1 \
          --serial0 socket \
          --vga serial0 \
          --agent enabled=1,fstrim_cloned_disks=1 \
          --onboot 1 \
          --protection 0 \
          --tablet 0 \
          --cicustom "user=local:snippets/flatcar-cloud-init-{{ item }}.yaml" \
          --ipconfig0 ip={{ hostvars[item]['ansible_host'] }}/{{ vm_cidr_bits | default('24') }},gw={{ vm_gateway }}
          
        # Set VM options for Flatcar
        qm set {{ hostvars[item]['vm_id'] }} \
          --args "-machine q35,accel=kvm -cpu host,+aes,+avx,+avx2 -smp {{ vm_specs.worker.cores }},sockets=1,cores={{ vm_specs.worker.cores }},threads=1"
          
        echo "Created VM {{ item }}"
      loop: "{{ groups['flatcar_worker'] }}"
      register: worker_vm_creation
      changed_when: "'Created VM' in worker_vm_creation.stdout"

    - name: Copy cloud-init configs to Proxmox snippets directory
      copy:
        src: "/tmp/flatcar-cloud-init-{{ item }}.yaml"
        dest: "/var/lib/vz/snippets/flatcar-cloud-init-{{ item }}.yaml"
        mode: '0644'
        remote_src: yes
      loop: "{{ groups['flatcar_controlplane'] + groups['flatcar_worker'] | default([]) }}"

    - name: Copy Ignition configs to Proxmox snippets directory
      copy:
        src: "/tmp/flatcar-ignition-{{ item }}.yaml"
        dest: "/var/lib/vz/snippets/flatcar-ignition-{{ item }}.yaml"
        mode: '0644'
        remote_src: yes
      loop: "{{ groups['flatcar_controlplane'] + groups['flatcar_worker'] | default([]) }}"

    - name: Start Flatcar VMs
      shell: qm start {{ hostvars[item]['vm_id'] }}
      loop: "{{ groups['flatcar_controlplane'] + groups['flatcar_worker'] | default([]) }}"
      register: vm_start
      failed_when: vm_start.rc != 0 and 'already running' not in vm_start.stderr
      changed_when: vm_start.rc == 0

    - name: Wait for VMs to be reachable via SSH
      wait_for:
        host: "{{ hostvars[item]['ansible_host'] }}"
        port: 22
        delay: 30
        timeout: 300
        state: started
      loop: "{{ groups['flatcar_controlplane'] + groups['flatcar_worker'] | default([]) }}"
      delegate_to: localhost

    - name: Display VM information
      debug:
        msg: 
          - "Flatcar VMs have been provisioned successfully!"
          - "Control plane nodes: {{ groups['flatcar_controlplane'] | join(', ') }}"
          - "Worker nodes: {{ groups['flatcar_worker'] | default([]) | join(', ') }}"
          - "Network: {{ vm_gateway }}/{{ vm_cidr_bits | default('24') }}"
          - "Next steps:"
          - "  1. Run cluster-bootstrap.yml to initialize Kubernetes"
          - "  2. Configure kubectl to access the cluster"