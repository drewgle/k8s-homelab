---
- name: Update Flatcar Container Linux with Kubernetes node draining
  hosts: flatcar_controlplane,flatcar_worker
  become: yes
  gather_facts: yes
  serial: 1  # Update nodes one at a time
  vars_files:
    - ../../vars.yml

  vars:
    # Load version information
    versions: "{{ lookup('file', '../../linux/flatcar/versions.yaml') | from_yaml }}"
    drain_timeout: 300  # 5 minutes
    kubectl_config: "/etc/kubernetes/admin.conf"

  tasks:
    - name: Check if node is part of Kubernetes cluster
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: k8s_node

    - name: Get kubectl config path
      set_fact:
        kubectl_config: "{{ '/home/core/.kube/config' if inventory_hostname in groups['flatcar_controlplane'] else '/tmp/admin.conf' }}"

    - name: Copy kubectl config for worker nodes
      shell: |
        scp -o StrictHostKeyChecking=no core@{{ hostvars[groups['flatcar_controlplane'][0]]['ansible_host'] }}:/home/core/.kube/config /tmp/admin.conf
      when: 
        - k8s_node.stat.exists
        - inventory_hostname in groups['flatcar_worker'] | default([])

    - name: Check if updates are available
      shell: |
        update_engine_client -status | grep "UPDATE_STATUS_UPDATED_NEED_REBOOT" || true
      register: update_status
      changed_when: false

    - name: Check current Flatcar version
      shell: |
        source /etc/os-release && echo "$VERSION"
      register: current_version
      changed_when: false

    - name: Display current status
      debug:
        msg:
          - "Node: {{ inventory_hostname }}"
          - "Current version: {{ current_version.stdout }}"
          - "Update status: {{ 'Reboot required' if 'UPDATE_STATUS_UPDATED_NEED_REBOOT' in update_status.stdout else 'Up to date' }}"

    - block:
        - name: Cordon node to prevent new pods
          shell: kubectl --kubeconfig={{ kubectl_config }} cordon {{ inventory_hostname }}
          delegate_to: "{{ groups['flatcar_controlplane'][0] }}"
          when: k8s_node.stat.exists

        - name: Drain node gracefully
          shell: |
            kubectl --kubeconfig={{ kubectl_config }} drain {{ inventory_hostname }} \
              --ignore-daemonsets \
              --delete-emptydir-data \
              --force \
              --timeout={{ drain_timeout }}s
          delegate_to: "{{ groups['flatcar_controlplane'][0] }}"
          when: k8s_node.stat.exists
          register: drain_result
          ignore_errors: yes

        - name: Wait for pods to be evicted
          shell: |
            kubectl --kubeconfig={{ kubectl_config }} get pods --all-namespaces --field-selector spec.nodeName={{ inventory_hostname }} --no-headers | wc -l
          register: pod_count
          delegate_to: "{{ groups['flatcar_controlplane'][0] }}"
          until: pod_count.stdout | int <= 1  # Allow for 1 remaining pod (usually kube-proxy or similar)
          retries: 30
          delay: 10
          when: k8s_node.stat.exists and drain_result is succeeded

        - name: Check if reboot is required
          shell: |
            update_engine_client -status | grep "UPDATE_STATUS_UPDATED_NEED_REBOOT"
          register: reboot_required
          failed_when: false
          changed_when: false

        - name: Enable automatic updates temporarily
          shell: |
            systemctl unmask update-engine.service
            systemctl start update-engine.service
          when: reboot_required.rc != 0

        - name: Check for updates
          shell: update_engine_client -check_for_update
          when: reboot_required.rc != 0
          register: check_updates

        - name: Wait for updates to complete
          shell: |
            while true; do
              status=$(update_engine_client -status | grep "^CURRENT_OP=" | cut -d= -f2)
              case "$status" in
                "UPDATE_STATUS_UPDATED_NEED_REBOOT")
                  echo "Update complete, reboot required"
                  break
                  ;;
                "UPDATE_STATUS_IDLE")
                  echo "No updates available"
                  break
                  ;;
                "UPDATE_STATUS_CHECKING_FOR_UPDATE"|"UPDATE_STATUS_UPDATE_AVAILABLE"|"UPDATE_STATUS_DOWNLOADING"|"UPDATE_STATUS_FINALIZING")
                  echo "Update in progress: $status"
                  sleep 30
                  ;;
                *)
                  echo "Unknown status: $status"
                  sleep 30
                  ;;
              esac
            done
          when: reboot_required.rc != 0
          register: update_wait

        - name: Disable automatic updates
          shell: |
            systemctl stop update-engine.service
            systemctl mask update-engine.service
          when: reboot_required.rc != 0

        - name: Reboot node if required
          reboot:
            reboot_timeout: 600
            connect_timeout: 20
            test_command: whoami
          when: "'UPDATE_STATUS_UPDATED_NEED_REBOOT' in update_status.stdout or 'reboot required' in update_wait.stdout | default('')"

        - name: Wait for node to be ready after reboot
          wait_for_connection:
            timeout: 300
            delay: 30
          when: "'UPDATE_STATUS_UPDATED_NEED_REBOOT' in update_status.stdout or 'reboot required' in update_wait.stdout | default('')"

        - name: Wait for kubelet to start
          wait_for:
            port: 10250
            host: "{{ ansible_default_ipv4.address }}"
            delay: 30
            timeout: 300
          when: k8s_node.stat.exists

        - name: Uncordon node
          shell: kubectl --kubeconfig={{ kubectl_config }} uncordon {{ inventory_hostname }}
          delegate_to: "{{ groups['flatcar_controlplane'][0] }}"
          when: k8s_node.stat.exists
          register: uncordon_result
          until: uncordon_result.rc == 0
          retries: 10
          delay: 30

        - name: Wait for node to be Ready
          shell: kubectl --kubeconfig={{ kubectl_config }} get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
          register: node_ready
          delegate_to: "{{ groups['flatcar_controlplane'][0] }}"
          until: node_ready.stdout == "True"
          retries: 30
          delay: 10
          when: k8s_node.stat.exists

        - name: Verify updated version
          shell: |
            source /etc/os-release && echo "$VERSION"
          register: new_version
          changed_when: false

        - name: Display update results
          debug:
            msg:
              - "Update completed for {{ inventory_hostname }}"
              - "Previous version: {{ current_version.stdout }}"
              - "Current version: {{ new_version.stdout }}"
              - "Status: {{ 'Updated' if current_version.stdout != new_version.stdout else 'No update needed' }}"

      when: "'UPDATE_STATUS_UPDATED_NEED_REBOOT' in update_status.stdout"

    - name: Display no update message
      debug:
        msg:
          - "No updates required for {{ inventory_hostname }}"
          - "Current version: {{ current_version.stdout }}"
      when: "'UPDATE_STATUS_UPDATED_NEED_REBOOT' not in update_status.stdout"


- name: Verify cluster health after updates
  hosts: flatcar_controlplane[0]
  become: yes
  gather_facts: no
  vars_files:
    - ../../vars.yml

  tasks:
    - name: Get cluster node status
      shell: kubectl --kubeconfig=/home/core/.kube/config get nodes -o wide
      register: final_node_status

    - name: Get pod status
      shell: kubectl --kubeconfig=/home/core/.kube/config get pods --all-namespaces | grep -E "(Pending|Error|CrashLoopBackOff)" || echo "All pods healthy"
      register: pod_health

    - name: Display final cluster status
      debug:
        msg:
          - "Flatcar update process completed!"
          - ""
          - "Final node status:"
          - "{{ final_node_status.stdout_lines }}"
          - ""
          - "Pod health check:"
          - "{{ pod_health.stdout_lines }}"
          - ""
          - "All nodes have been updated and rejoined the cluster successfully."