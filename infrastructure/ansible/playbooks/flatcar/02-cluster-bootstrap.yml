---
- name: Bootstrap Kubernetes cluster on Flatcar Container Linux
  hosts: flatcar_controlplane[0]
  become: yes
  gather_facts: yes
  vars_files:
    - "{{ playbook_dir }}/../../vars.yml"

  vars:
    versions: "{{ lookup('file', playbook_dir + '/../../../linux/flatcar/versions.yaml') | from_yaml }}"
    kubernetes_version: "{{ versions.kubernetes.version }}"

  tasks:
    - name: Wait for Flatcar to be ready
      wait_for_connection:
        timeout: 300
        delay: 10

    - name: Verify Kubernetes binaries are installed
      stat:
        path: /opt/bin/kubeadm
      register: kubeadm_binary

    - name: Fail if Kubernetes binaries are not installed
      fail:
        msg: "Kubernetes binaries not found. Ensure Ignition configuration was applied correctly."
      when: not kubeadm_binary.stat.exists

    - name: Check if cluster is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: cluster_initialized

    # kubeadm >= 1.29 does not produce a usable admin.conf until init has
    # finished, so kube-vip cannot authenticate during init. Point it at
    # super-admin.conf for the duration and switch back afterwards.
    # https://github.com/kube-vip/kube-vip/issues/684
    - name: Point kube-vip at super-admin.conf for the duration of init
      replace:
        path: /etc/kubernetes/manifests/kube-vip.yaml
        regexp: '/etc/kubernetes/admin\.conf'
        replace: /etc/kubernetes/super-admin.conf
      when:
        - flatcar_vip is defined
        - not cluster_initialized.stat.exists

    # kube-proxy is skipped when Cilium is the CNI: Cilium replaces it
    # (spec 0016, CNI-04). Removing it after the fact is a live-cluster
    # migration, so the decision has to be made here.
    - name: Initialize Kubernetes cluster
      command: >
        kubeadm init
        --config=/etc/kubernetes/kubeadm-config.yaml
        --upload-certs
        {{ '--skip-phases=addon/kube-proxy' if kubernetes_cni | default('cilium') == 'cilium' else '' }}
      when: not cluster_initialized.stat.exists
      register: kubeadm_init

    - name: Point kube-vip back at admin.conf
      replace:
        path: /etc/kubernetes/manifests/kube-vip.yaml
        regexp: '/etc/kubernetes/super-admin\.conf'
        replace: /etc/kubernetes/admin.conf
      when: flatcar_vip is defined

    # A wrong flatcar_vip_interface is the most likely way this silently does
    # nothing, so fail here rather than at the first control plane outage.
    - name: Wait for the control plane VIP to answer
      wait_for:
        host: "{{ flatcar_vip }}"
        port: 6443
        timeout: 180
      when: flatcar_vip is defined

    - name: Create kubectl directory for core user
      file:
        path: /home/core/.kube
        state: directory
        owner: core
        group: core
        mode: '0755'

    - name: Copy admin.conf to core user's kubectl config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/core/.kube/config
        remote_src: yes
        owner: core
        group: core
        mode: '0600'


- name: Join additional control plane nodes to cluster
  hosts: flatcar_controlplane[1:]
  become: yes
  gather_facts: yes

  tasks:
    - name: Wait for node to be ready
      wait_for_connection:
        timeout: 300
        delay: 10

    - name: Check if node has already joined cluster
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: node_joined

    - name: Generate control plane join command
      shell: >
        kubeadm token create --ttl 1h --print-join-command
        --certificate-key $(kubeadm init phase upload-certs --upload-certs 2>/dev/null | tail -1)
      delegate_to: "{{ groups['flatcar_controlplane'][0] }}"
      when: not node_joined.stat.exists
      register: cp_join_command

    - name: Join control plane node to cluster
      command: "{{ cp_join_command.stdout }}"
      when: not node_joined.stat.exists

    - name: Create kubectl directory for core user
      file:
        path: /home/core/.kube
        state: directory
        owner: core
        group: core
        mode: '0755'

    - name: Copy admin.conf to core user's kubectl config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/core/.kube/config
        remote_src: yes
        owner: core
        group: core
        mode: '0600'


- name: Join worker nodes to cluster
  hosts: flatcar_worker
  become: yes
  gather_facts: yes

  tasks:
    - name: Wait for node to be ready
      wait_for_connection:
        timeout: 300
        delay: 10

    - name: Check if node has already joined cluster
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: node_joined

    - name: Generate worker join command
      command: kubeadm token create --ttl 1h --print-join-command
      delegate_to: "{{ groups['flatcar_controlplane'][0] }}"
      when: not node_joined.stat.exists
      register: worker_join_command

    - name: Join worker node to cluster
      command: "{{ worker_join_command.stdout }}"
      when: not node_joined.stat.exists


- name: Configure cluster networking and finalize setup
  hosts: flatcar_controlplane[0]
  become: yes
  gather_facts: no
  vars_files:
    - "{{ playbook_dir }}/../../vars.yml"

  vars:
    versions: "{{ lookup('file', playbook_dir + '/../../../linux/flatcar/versions.yaml') | from_yaml }}"
    # Cilium needs to reach the API server before a Service network exists,
    # so it is pointed at the control plane endpoint directly (spec 0016,
    # CNI-05). Flatcar has no KubePrism equivalent.
    apiserver_host: "{{ flatcar_cluster_endpoint | regex_replace('^https?://') | regex_replace(':.*$') }}"
    apiserver_port: "{{ flatcar_cluster_endpoint | regex_replace('^.*:', '') }}"

  tasks:
    - name: Wait for all nodes to register
      shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes --no-headers
      register: node_status
      until: >-
        node_status.stdout_lines | length ==
        ((groups['flatcar_controlplane'] | length) + (groups['flatcar_worker'] | default([]) | length))
      retries: 30
      delay: 10
      changed_when: false

    - name: Install CNI plugin (Flannel)
      command: >
        kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f
        https://github.com/flannel-io/flannel/releases/download/{{ versions.cni.flannel_version }}/kube-flannel.yml
      when: kubernetes_cni | default('cilium') == 'flannel'
      register: cni_install

    - name: Require helm on the first control plane
      command: helm version --short
      register: helm_present
      changed_when: false
      failed_when: helm_present.rc != 0
      when: kubernetes_cni | default('cilium') == 'cilium'

    - name: Add the Cilium Helm repository
      command: helm repo add cilium https://helm.cilium.io
      register: cilium_repo
      changed_when: "'has been added' in cilium_repo.stdout"
      when: kubernetes_cni | default('cilium') == 'cilium'

    # No Talos securityContext/cgroup overrides here — those are specific to
    # Talos's read-only rootfs (spec 0016, CNI-06).
    - name: Install CNI plugin (Cilium) with kube-proxy replacement
      command: >
        helm upgrade --install cilium cilium/cilium
        --version {{ versions.cni.cilium_version }}
        --namespace kube-system
        --kubeconfig /etc/kubernetes/admin.conf
        --set ipam.mode=kubernetes
        --set kubeProxyReplacement=true
        --set k8sServiceHost={{ apiserver_host }}
        --set k8sServicePort={{ apiserver_port }}
        --set operator.replicas=1
        --set hubble.relay.enabled=true
        --set hubble.ui.enabled=true
        --wait --timeout 10m
      when: kubernetes_cni | default('cilium') == 'cilium'
      register: cilium_install

    - name: Wait for all pods to be ready
      shell: >
        kubectl --kubeconfig=/etc/kubernetes/admin.conf get pods --all-namespaces
        --field-selector=status.phase!=Running,status.phase!=Succeeded --no-headers
      register: pending_pods
      until: pending_pods.stdout_lines | length == 0
      retries: 60
      delay: 10
      changed_when: false
      failed_when: false

    - name: Get cluster info
      command: kubectl --kubeconfig=/etc/kubernetes/admin.conf cluster-info
      register: cluster_info
      changed_when: false

    - name: Get node status
      command: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes -o wide
      register: final_node_status
      changed_when: false

    - name: Display cluster status
      debug:
        msg:
          - "Kubernetes cluster bootstrap completed!"
          - "Cluster info:"
          - "{{ cluster_info.stdout_lines }}"
          - ""
          - "Node status:"
          - "{{ final_node_status.stdout_lines }}"

    - name: Save kubeconfig to control machine
      fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/../../../linux/flatcar/generated/kubeconfig"
        flat: yes
