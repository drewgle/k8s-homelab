# Run ansible-playbook from this directory so inventory and roles resolve.
[defaults]
inventory = inventory.yaml
roles_path = roles
# Host key checking is disabled deliberately: homelab nodes are rebuilt
# often and live on a trusted LAN. Re-enable for anything internet-facing.
host_key_checking = False
timeout = 30
retry_files_enabled = False
gathering = smart
fact_caching = memory
stdout_callback = yaml
callbacks_enabled = timer, profile_tasks

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
