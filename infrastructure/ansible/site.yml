---
# Full Proxmox infrastructure stack: initial setup, reboot, clustering, Ceph.
# Kubernetes provisioning runs separately:
#   ansible-playbook playbooks/talos/01-provision-vms.yml && ansible-playbook playbooks/talos/02-cluster-create.yml
# Optional hardening: ansible-playbook playbooks/proxmox/harden.yml
- name: Initial Proxmox setup
  import_playbook: playbooks/proxmox/01-initial-setup.yml
- name: Rolling reboot
  import_playbook: playbooks/proxmox/02-reboot.yml
- name: Create Proxmox cluster
  import_playbook: playbooks/proxmox/03-cluster-create.yml
- name: Deploy Ceph storage
  import_playbook: playbooks/proxmox/04-ceph-deploy.yml
