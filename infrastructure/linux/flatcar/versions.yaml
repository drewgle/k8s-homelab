# Flatcar Container Linux and Kubernetes version management
# The "# renovate:" annotations are matched by the custom manager in
# renovate.json for automatic updates.

# Flatcar Container Linux versions
flatcar:
  # Release channel: stable, beta, alpha
  channel: "stable"
  # OS version used for the install ISO. Running nodes track the release
  # channel via update_engine, so this only gates newly provisioned nodes.
  # Flatcar tags releases as "<channel>-<version>"; the packageRule in
  # renovate.json strips the channel prefix and keeps this on stable.
  # renovate: datasource=github-releases depName=flatcar/scripts
  version: "4593.2.4"
  # Update strategy: manual or auto
  update_strategy: "auto"

# Kubernetes version - installed by kubeadm, independent of the OS release
kubernetes:
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  version: "v1.36.3"

# Container runtime versions (informational - provided by Flatcar)
containerd:
  version: "2.1.5"

# CNI plugin versions. kubeadm installs no CNI addon (spec 0016); these drive
# the post-bootstrap install and must match the Talos values so spec 0010
# compares operating systems rather than network stacks. The Cilium value is a
# Helm chart version (no leading "v"); flannel is a GitHub release tag.
cni:
  # renovate: datasource=github-releases depName=containernetworking/plugins
  plugins_version: "v1.9.1"
  # renovate: datasource=github-releases depName=flannel-io/flannel
  flannel_version: "v0.28.8"
  # renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io
  cilium_version: "1.19.6"

# Control plane VIP. Talos has this built in; kubeadm needs a component for
# it, which is itself a spec 0010 finding. See spec 0016.
kube_vip:
  # renovate: datasource=github-releases depName=kube-vip/kube-vip
  version: "v1.2.1"

# Additional tools
tools:
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  kubeadm_version: "v1.36.3"
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  kubelet_version: "v1.36.3"
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  kubectl_version: "v1.36.3"
