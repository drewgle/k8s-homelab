---
- name: Common Ceph Setup Tasks
  hosts: proxmox
  become: yes
  gather_facts: yes
  vars_files:
    - ../../../vars.yml
  
  vars:
    # Ceph cluster configuration
    cluster_network: "{{ ceph_cluster_network | default('10.0.1.0/24') }}"
    public_network: "{{ ceph_public_network | default('192.168.1.0/24') }}"

  tasks:
    - name: Check minimum node requirements
      assert:
        that: groups['proxmox'] | length >= 3
        fail_msg: "Ceph requires at least 3 nodes for proper operation"
        success_msg: "Sufficient nodes available for Ceph cluster ({{ groups['proxmox'] | length }} nodes)"
      run_once: true

    - name: Install Ceph packages
      apt:
        name:
          - ceph
          - ceph-common
          - ceph-fuse
          - ceph-mds
          - ceph-mgr
          - ceph-mon
          - ceph-osd
          - python3-ceph-argparse
          - python3-cephfs
          - python3-rados
          - python3-rbd
        state: present
        update_cache: yes

    - name: Ensure ceph user exists
      user:
        name: ceph
        system: yes
        shell: /bin/false
        home: /var/lib/ceph
        create_home: no

    - name: Create Ceph configuration directories
      file:
        path: "{{ item }}"
        state: directory
        owner: ceph
        group: ceph
        mode: '0755'
      loop:
        - /etc/ceph
        - /var/lib/ceph
        - /var/lib/ceph/mon
        - /var/lib/ceph/mgr
        - /var/lib/ceph/osd
        - /var/lib/ceph/mds
        - /var/lib/ceph/bootstrap-osd
        - /var/log/ceph

    - name: Check if Ceph cluster configuration exists
      stat:
        path: /etc/ceph/ceph.conf
      register: ceph_config_exists

    - name: Set cluster status facts
      set_fact:
        cluster_exists: "{{ ceph_config_exists.stat.exists }}"
        is_new_node: "{{ not ceph_config_exists.stat.exists }}"

    - name: Display node status
      debug:
        msg: "Node {{ inventory_hostname }}: {{ 'Already configured' if cluster_exists else 'New node - needs configuration' }}"