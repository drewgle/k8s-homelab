---
- name: Provision Talos VMs on Proxmox
  hosts: proxmox[0]
  become: yes
  gather_facts: yes
  vars_files:
    - ../../../vars.yml

  vars:
    # Load version information
    versions: "{{ lookup('file', '../../../linux/talos/versions.yaml') | from_yaml }}"
    talos_installer_version: "{{ versions.talos.installer }}"
    
    # VM specifications
    vm_specs:
      controlplane:
        cores: "{{ talos_cp_cores | default(4) }}"
        memory: "{{ talos_cp_memory | default(4096) }}"
        disk_size: "{{ talos_cp_disk_size | default('50G') }}"
      worker:
        cores: "{{ talos_worker_cores | default(2) }}"
        memory: "{{ talos_worker_memory | default(8192) }}"
        disk_size: "{{ talos_worker_disk_size | default('100G') }}"

  tasks:
    - name: Check Proxmox cluster status
      command: pvecm status
      register: cluster_status
      failed_when: false

    - name: Verify Proxmox cluster is healthy
      assert:
        that: cluster_status.rc == 0
        fail_msg: "Proxmox cluster not available or unhealthy"
        success_msg: "Proxmox cluster is operational"

    - name: Create Talos VLAN bridge if not exists
      shell: |
        if ! ip link show {{ talos_bridge_name | default('vmbr1') }} >/dev/null 2>&1; then
          ip link add name {{ talos_bridge_name | default('vmbr1') }} type bridge
          ip link set {{ talos_bridge_name | default('vmbr1') }} up
          echo "auto {{ talos_bridge_name | default('vmbr1') }}" >> /etc/network/interfaces
          echo "iface {{ talos_bridge_name | default('vmbr1') }} inet manual" >> /etc/network/interfaces
          echo "        bridge-ports none" >> /etc/network/interfaces
          echo "        bridge-stp off" >> /etc/network/interfaces
          echo "        bridge-fd 0" >> /etc/network/interfaces
          echo "        bridge-vlan-aware yes" >> /etc/network/interfaces
        fi
      register: bridge_created
      changed_when: "'Bridge created' in bridge_created.stdout"

    - name: Check if Talos ISO exists
      stat:
        path: "/var/lib/vz/template/iso/talos-{{ talos_installer_version }}-amd64.iso"
      register: talos_iso

    - name: Download Talos ISO
      get_url:
        url: "https://github.com/siderolabs/talos/releases/download/{{ talos_installer_version }}/metal-amd64.iso"
        dest: "/var/lib/vz/template/iso/talos-{{ talos_installer_version }}-amd64.iso"
        mode: '0644'
        timeout: 300
      when: not talos_iso.stat.exists
      register: iso_download

    - name: Generate cloud-init user data for Talos nodes
      template:
        src: "../../../linux/talos/templates/cloud-init-talos.yaml.j2"
        dest: "/tmp/talos-cloud-init-{{ item }}.yaml"
        mode: '0644'
      loop: "{{ groups['talos_controlplane'] + groups['talos_worker'] | default([]) }}"
      vars:
        node_hostname: "{{ item }}"
        node_ip: "{{ hostvars[item]['ansible_host'] }}"
        node_gateway: "{{ talos_gateway }}"
        node_netmask: "{{ talos_netmask | default('255.255.255.0') }}"

    - name: Create control plane VMs
      shell: |
        # Check if VM already exists
        if qm list | grep -q "{{ hostvars[item]['vm_id'] | default(loop.index + 200) }}"; then
          echo "VM {{ item }} already exists"
          exit 0
        fi
        
        # Create VM
        qm create {{ hostvars[item]['vm_id'] | default(loop.index + 200) }} \
          --name {{ item }} \
          --memory {{ vm_specs.controlplane.memory }} \
          --cores {{ vm_specs.controlplane.cores }} \
          --sockets 1 \
          --numa 1 \
          --ostype l26 \
          --cpu cputype=host \
          --scsihw virtio-scsi-pci \
          --scsi0 {{ talos_storage | default('local-lvm') }}:{{ vm_specs.controlplane.disk_size }},iothread=1 \
          --ide2 local:iso/talos-{{ talos_installer_version }}-amd64.iso,media=cdrom \
          --boot order=ide2 \
          --net0 virtio,bridge={{ talos_bridge_name | default('vmbr1') }},tag={{ talos_vlan_id | default(100) }},firewall=1 \
          --serial0 socket \
          --vga serial0 \
          --agent enabled=1,fstrim_cloned_disks=1 \
          --onboot 1 \
          --protection 0 \
          --tablet 0
          
        # Set VM options for Talos
        qm set {{ hostvars[item]['vm_id'] | default(loop.index + 200) }} \
          --args "-machine q35,accel=kvm -cpu host,+aes,+avx,+avx2 -smp {{ vm_specs.controlplane.cores }},sockets=1,cores={{ vm_specs.controlplane.cores }},threads=1"
          
        echo "Created VM {{ item }}"
      loop: "{{ groups['talos_controlplane'] }}"
      loop_control:
        index_var: loop_index
      register: cp_vm_creation
      changed_when: "'Created VM' in cp_vm_creation.stdout"

    - name: Create worker VMs
      shell: |
        # Check if VM already exists
        if qm list | grep -q "{{ hostvars[item]['vm_id'] | default(loop.index + 210) }}"; then
          echo "VM {{ item }} already exists"
          exit 0
        fi
        
        # Create VM
        qm create {{ hostvars[item]['vm_id'] | default(loop.index + 210) }} \
          --name {{ item }} \
          --memory {{ vm_specs.worker.memory }} \
          --cores {{ vm_specs.worker.cores }} \
          --sockets 1 \
          --numa 1 \
          --ostype l26 \
          --cpu cputype=host \
          --scsihw virtio-scsi-pci \
          --scsi0 {{ talos_storage | default('local-lvm') }}:{{ vm_specs.worker.disk_size }},iothread=1 \
          --ide2 local:iso/talos-{{ talos_installer_version }}-amd64.iso,media=cdrom \
          --boot order=ide2 \
          --net0 virtio,bridge={{ talos_bridge_name | default('vmbr1') }},tag={{ talos_vlan_id | default(100) }},firewall=1 \
          --serial0 socket \
          --vga serial0 \
          --agent enabled=1,fstrim_cloned_disks=1 \
          --onboot 1 \
          --protection 0 \
          --tablet 0
          
        # Set VM options for Talos
        qm set {{ hostvars[item]['vm_id'] | default(loop.index + 210) }} \
          --args "-machine q35,accel=kvm -cpu host,+aes,+avx,+avx2 -smp {{ vm_specs.worker.cores }},sockets=1,cores={{ vm_specs.worker.cores }},threads=1"
          
        echo "Created VM {{ item }}"
      loop: "{{ groups['talos_worker'] | default([]) }}"
      loop_control:
        index_var: loop_index
      register: worker_vm_creation
      changed_when: "'Created VM' in worker_vm_creation.stdout"

    - name: Start control plane VMs
      shell: |
        if ! qm status {{ hostvars[item]['vm_id'] | default(loop.index + 200) }} | grep -q "running"; then
          qm start {{ hostvars[item]['vm_id'] | default(loop.index + 200) }}
          echo "Started VM {{ item }}"
        else
          echo "VM {{ item }} already running"
        fi
      loop: "{{ groups['talos_controlplane'] }}"
      loop_control:
        index_var: loop_index
      register: cp_vm_start
      changed_when: "'Started VM' in cp_vm_start.stdout"

    - name: Start worker VMs
      shell: |
        if ! qm status {{ hostvars[item]['vm_id'] | default(loop.index + 210) }} | grep -q "running"; then
          qm start {{ hostvars[item]['vm_id'] | default(loop.index + 210) }}
          echo "Started VM {{ item }}"
        else
          echo "VM {{ item }} already running"
        fi
      loop: "{{ groups['talos_worker'] | default([]) }}"
      loop_control:
        index_var: loop_index
      register: worker_vm_start
      changed_when: "'Started VM' in worker_vm_start.stdout"

    - name: Wait for VMs to boot into Talos maintenance mode
      wait_for:
        host: "{{ hostvars[item]['ansible_host'] }}"
        port: 50000
        delay: 30
        timeout: 600
      loop: "{{ groups['talos_controlplane'] + groups['talos_worker'] | default([]) }}"
      delegate_to: localhost

    - name: Display VM creation summary
      debug:
        msg: |
          === Talos VM Provisioning Complete ===
          
          Control Plane VMs: {{ groups['talos_controlplane'] | length }}
          Worker VMs: {{ groups['talos_worker'] | default([]) | length }}
          
          Network Configuration:
          - VLAN ID: {{ talos_vlan_id | default(100) }}
          - Bridge: {{ talos_bridge_name | default('vmbr1') }}
          - Gateway: {{ talos_gateway }}
          
          VM IDs Assigned:
          {% for host in groups['talos_controlplane'] %}
          - {{ host }}: {{ hostvars[host]['vm_id'] | default(loop.index + 200) }} ({{ hostvars[host]['ansible_host'] }})
          {% endfor %}
          {% for host in groups['talos_worker'] | default([]) %}
          - {{ host }}: {{ hostvars[host]['vm_id'] | default(loop.index + 210) }} ({{ hostvars[host]['ansible_host'] }})
          {% endfor %}
          
          Next Steps:
          1. Verify VMs are accessible on port 50000
          2. Run: ansible-playbook playbooks/talos/cluster-create.yml
      run_once: true

    - name: Verify Talos API accessibility  
      uri:
        url: "https://{{ hostvars[item]['ansible_host'] }}:50000/v1/service/list"
        method: POST
        headers:
          Content-Type: "application/json"
        body: "{}"
        validate_certs: no
        timeout: 10
      loop: "{{ groups['talos_controlplane'] + groups['talos_worker'] | default([]) }}"
      register: talos_api_check
      failed_when: false
      delegate_to: localhost

    - name: Display connectivity status
      debug:
        msg: |
          Node {{ item.item }}: {{ 'API Accessible' if item.status == 200 else 'API Not Ready (' + (item.status | string) + ')' }}
      loop: "{{ talos_api_check.results }}"
      when: talos_api_check.results is defined